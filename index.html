<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Variação de Preço do Jogo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    h2 {
      text-align: center;
    }

    .grafico-linha {
      position: relative;
      width: 600px;
      height: 300px;
      border-left: 2px solid #333;
      border-bottom: 2px solid #333;
      margin: auto;
    }

    .linha {
      position: absolute;
      width: 2px;
      background: #4CAF50;
      transform-origin: bottom left;
    }

    .ponto {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #2196F3;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .rotulo {
      position: absolute;
      transform: translateX(-50%);
      top: 100%;
      margin-top: 10px;
      font-size: 14px;
    }

    .preco {
      position: absolute;
      left: -40px;
      font-size: 14px;
    }

    /* Linhas horizontais de referência */
    .linha-ref {
      position: absolute;
      width: 100%;
      height: 1px;
      background: #ccc;
    }

  </style>
</head>
<body>

  <h2>Variação de Preço do Jogo (últimos 6 meses)</h2>

  <div class="grafico-linha" id="grafico">
    <!-- Linhas de referência -->
    <div class="linha-ref" style="top: 0%;"><span class="preco" style="top: -8px;">R$600</span></div>
    <div class="linha-ref" style="top: 25%;"><span class="preco" style="top: -8px;">R$525</span></div>
    <div class="linha-ref" style="top: 50%;"><span class="preco" style="top: -8px;">R$450</span></div>
    <div class="linha-ref" style="top: 75%;"><span class="preco" style="top: -8px;">R$375</span></div>
    <div class="linha-ref" style="top: 100%;"><span class="preco" style="top: -8px;">R$300</span></div>

    <!-- Pontos e rótulos dos meses -->
    <div class="ponto" style="left: 10%; top: 33%;"></div>
    <div class="rotulo" style="left: 10%;">Dez</div>

    <div class="ponto" style="left: 25%; top: 25%;"></div>
    <div class="rotulo" style="left: 25%;">Jan</div>

    <div class="ponto" style="left: 40%; top: 41%;"></div>
    <div class="rotulo" style="left: 40%;">Fev</div>

    <div class="ponto" style="left: 55%; top: 50%;"></div>
    <div class="rotulo" style="left: 55%;">Mar</div>

    <div class="ponto" style="left: 70%; top: 30%;"></div>
    <div class="rotulo" style="left: 70%;">Abr</div>

    <div class="ponto" style="left: 85%; top: 20%;"></div>
    <div class="rotulo" style="left: 85%;">Mai</div>
  </div>

</body>

</html>
